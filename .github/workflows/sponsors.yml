name: Sponsors

# Refreshes the sponsor avatars in README.md once a day.
# Needs a SPONSORS_TOKEN secret: a personal access token of the sponsored account with the read:user and read:org scopes
# (the built-in GITHUB_TOKEN can't read sponsors).

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: JamesIves/github-sponsors-readme-action@v1
        with:
          token: ${{ secrets.SPONSORS_TOKEN }}
          file: README.md
          template: '<a href="https://github.com/{{{ login }}}"><img src="https://github.com/{{{ login }}}.png?size=120" width="60" alt="{{{ name }}}" /></a>&nbsp;'

      - name: Commit if changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: update sponsors"
          git push
